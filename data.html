<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista completa de tarefas</title>
    <link rel="stylesheet" href="https://cdn.datatables.net/1.11.5/css/jquery.dataTables.min.css">
    <link rel="stylesheet" href="styles.css?ver=1.0.4">
    <link rel="stylesheet" href="datatable-styles.css?ver=1.0.4">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.14.1/themes/base/jquery-ui.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css">
</head>
<body>
    <div class="container">
        <div class="tabs-container">
            <button class="tab-btn" data-tab="recepcao">RECEPÇÃO</button>
            <button class="tab-btn" data-tab="com-equipes">COM EQUIPES</button>
            <button class="tab-btn" data-tab="notas-para-baixar">NOTAS PARA BAIXAR</button>
            <button class="tab-btn" data-tab="notas-baixadas">NOTAS BAIXADAS</button>
            <button class="tab-btn" data-tab="com-tags">COM TAGS</button>
        </div>
        <button id="btnTransferir" class="action-btn transfer-btn" disabled>Transferir Tarefa(s)</button>
        <table id="tasksTable" class="display compact" style="width:100%">
            <thead>
                <tr class="header-row">
                    <th></th>
                    <th>Quem</th>
                    <th>SS</th>
                    <th>Rua</th>
                    <th>Número</th>
                    <th>Cidade</th>
                    <th>Bairro</th>
                    <th>Setor</th>
                    <th>Data de Registro</th>
                    <th>Última atividade</th>
                    <th>Situação</th>
                    <th>Status de Integração</th>
                    <th>Tarefa</th>
                    <th>Prioridade</th>
                    <th>Serviço Solicitado</th>
                    <th>Tags</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr class="filter-row">
                    <th></th>
                    <th></th>
                    <th></th>
                    <th></th>
                    <th></th>
                    <th></th>
                    <th></th>
                    <th></th>
                    <th></th>
                    <th></th>
                    <th></th>
                    <th></th>
                    <th></th>
                    <th></th>
                    <th></th>
                    <th></th>
                    <th></th>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <th></th>
                    <th></th>
                    <th></th>
                    <th></th>
                    <th></th>
                    <th></th>
                    <th></th>
                    <th></th>
                    <th></th>
                    <th></th>
                    <th></th>
                    <th></th>
                    <th></th>
                    <th></th>
                    <th></th>
                    <th></th>
                    <th></th>
                </tr>
            </tfoot>
        </table>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
    <script src="https://code.jquery.com/ui/1.14.1/jquery-ui.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
</body>
</html>
